name: PROJECT-OPICK-X110-DTC-LOCK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Jakarta
      CLANG_VERSION: "clang-r416183b"
      CLANG_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12L-gsi/clang-r416183b.tar.gz"

    steps:

      # ============================================================
      # 1. HOST DEPENDENCIES
      #    Sengaja mengikuti jalur build panjang yang sudah terbukti.
      #    JANGAN menambah device-tree-compiler di sini.
      # ============================================================
      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            ca-certificates \
            ccache \
            clang \
            lld \
            curl \
            gcc \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            libxml2 \
            libxml2-dev \
            make \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            xz-utils \
            zip \
            coreutils \
            linux-libc-dev

      # ============================================================
      # 2. CLONE SOURCE
      # ============================================================
      - name: Clone GTA9 Source
        run: |
          git clone \
            --depth=1 \
            --branch 15.0 \
            https://github.com/prabhatkrmishra/kernel_samsung_gta9.git \
            gta9

          cd gta9
          git submodule sync --recursive
          git submodule update --init --depth=1

      # ============================================================
      # 3. ANDROID CLANG
      # ============================================================
      - name: Cache Android Clang
        id: cache-clang
        uses: actions/cache@v3
        with:
          path: gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}
          key: clang-${{ env.CLANG_VERSION }}

      - name: Download Android Clang
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p gta9/prebuilts-master/clang/host/linux-x86

          curl -L --fail \
            -o gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz \
            "${{ env.CLANG_URL }}"

          mkdir -p gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}

          tar -xzf \
            gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}.tar.gz \
            -C gta9/prebuilts-master/clang/host/linux-x86/${{ env.CLANG_VERSION }}

      # ============================================================
      # 4. RESTORE THE HISTORICAL BUILD LAYOUT
      #
      #    Ini sengaja mempertahankan pola run panjang:
      #      kernel-5.10 -> .
      #      build       -> setup/kernel/build
      #
      #    Wrapper clang -> GCC juga dipertahankan karena konfigurasi
      #    inilah yang berhasil melewati fixdep, Kconfig, dan mencapai DTC.
      # ============================================================
      - name: Restore Historical Toolchain Layout
        run: |
          set -eux

          cd gta9

          ln -sf . kernel-5.10
          ln -sf setup/kernel/build build

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}"
          TOOL_DIR="$PWD/build/build-tools/path/linux-x86"

          mkdir -p "$TOOL_DIR"

          # ----------------------------------------------------------
          # Historical clang wrapper
          # ----------------------------------------------------------
          cat > "$TOOL_DIR/clang" <<'EOF'
          #!/bin/bash
          ARGS=$(echo "$@" |
            sed 's/--rtlib=compiler-rt//g' |
            sed 's/-nostdinc//g' |
            sed 's/-isystem [^ ]*//g')
          exec /usr/bin/gcc $ARGS
          EOF

          chmod +x "$TOOL_DIR/clang"

          # ----------------------------------------------------------
          # Historical clang++ wrapper
          # ----------------------------------------------------------
          cat > "$TOOL_DIR/clang++" <<'EOF'
          #!/bin/bash
          ARGS=$(echo "$@" |
            sed 's/--rtlib=compiler-rt//g' |
            sed 's/-nostdinc//g' |
            sed 's/-isystem [^ ]*//g')
          exec /usr/bin/g++ $ARGS
          EOF

          chmod +x "$TOOL_DIR/clang++"

          # ----------------------------------------------------------
          # Android linker
          # ----------------------------------------------------------
          cp -f "$CLANG_ROOT/bin/ld.lld" "$TOOL_DIR/lld"
          ln -sf lld "$TOOL_DIR/ld.lld"

          # ----------------------------------------------------------
          # Keep Samsung helper PATH happy
          # ----------------------------------------------------------
          ln -sf /usr/bin/realpath "$TOOL_DIR/realpath"

          COMMANDS="
          python3
          env
          bash
          flex
          bison
          echo
          printf
          sleep
          ar
          as
          awk
          basename
          cat
          chmod
          cmp
          cp
          cut
          date
          dirname
          du
          env
          expr
          find
          grep
          head
          ld
          ln
          mkdir
          mktemp
          mv
          nproc
          objcopy
          objdump
          od
          pwd
          readlink
          rm
          sed
          sort
          stat
          tail
          tar
          test
          touch
          tr
          uname
          uniq
          wc
          which
          xargs
          zip
          make
          gcc
          g++
          aarch64-linux-gnu-gcc
          aarch64-linux-gnu-g++
          arm-linux-gnueabi-gcc
          arm-linux-gnueabi-g++
          "

          for cmd in $COMMANDS; do
            target="$(type -P "$cmd" || true)"
            if [ -n "$target" ]; then
              ln -sf "$target" "$TOOL_DIR/$cmd"
            fi
          done

          # ----------------------------------------------------------
          # Android clang compatibility library
          # ----------------------------------------------------------
          COMPAT_DIR="$CLANG_ROOT/compat-libs"
          mkdir -p "$COMPAT_DIR"

          SYSTEM_LIBXML="$(ldconfig -p |
            grep 'libxml2.so.2 ' |
            head -n 1 |
            sed 's/.*=> //')"

          if [ -n "$SYSTEM_LIBXML" ]; then
            ln -sf "$SYSTEM_LIBXML" \
              "$COMPAT_DIR/libxml2.so.2.9.10"
          fi

      # ============================================================
      # 5. GENERATE BUILD CONFIG
      # ============================================================
      - name: Generate Build Config
        run: |
          set -eux

          cd gta9

          rm -rf out
          mkdir -p out

          python3 -m lib2to3 -w scripts/gen_build_config.py

          python3 scripts/gen_build_config.py \
            --kernel-defconfig gta9_00_defconfig \
            --kernel-defconfig-overlays \
              "entry_level.config ot11.config ot11_data.config ot11_wifi.config" \
            -m user \
            -o out/build.config

      # ============================================================
      # 6. ENVIRONMENT
      #
      #    Perhatikan:
      #    HOSTCC/HOSTCXX/HOSTLD tetap ada sebagai environment,
      #    tetapi TIDAK kita kirim lagi sebagai argumen langsung
      #    ke build.sh.
      #
      #    Ini mengembalikan pola historical run.
      # ============================================================
      - name: Set Build Environment
        run: |
          set -eux

          cd gta9

          CLANG_ROOT="$PWD/prebuilts-master/clang/host/linux-x86/${CLANG_VERSION}"

          sed -i \
            "s#^CLANG_PREBUILT_BIN=.*#CLANG_PREBUILT_BIN=$CLANG_ROOT/bin#" \
            out/build.config

          echo "PATH=$PWD/build/build-tools/path/linux-x86:\$PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$CLANG_ROOT/compat-libs:\$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

          echo "C_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=/usr/include/x86_64-linux-gnu:/usr/include" >> "$GITHUB_ENV"

      # ============================================================
      # 7. KERNEL BUILD
      #
      #    INI PERUBAHAN UTAMA:
      #
      #      sebelumnya:
      #        DTC=dtc
      #
      #      sekarang:
      #        DTC=./scripts/dtc/dtc
      #
      #    Karena final make berada di:
      #      out/kernel-5.10
      #
      #    maka:
      #      ./scripts/dtc/dtc
      #
      #    menunjuk ke DTC yang baru saja dibangun oleh Kbuild.
      #
      #    HOSTCC/GCC TIDAK dipaksa lewat command line.
      # ============================================================
      - name: Execute Kernel Build
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          LLVM: "1"
          LLVM_IAS: "1"
          OUT_DIR: out
          DIST_DIR: out
          BUILD_CONFIG: out/build.config

          HOSTCC: /usr/bin/gcc
          HOSTCXX: /usr/bin/g++
          HOSTLD: /usr/bin/gcc

          KCFLAGS: "-Wno-error"

        run: |
          set -eux

          cd gta9

          chmod +x build/build.sh

          echo "========================================================"
          echo " DTC-LOCK BUILD"
          echo "========================================================"
          echo " DTC=./scripts/dtc/dtc"
          echo " HOSTCC is environment only"
          echo " HOSTCXX is environment only"
          echo " HOSTLD is environment only"
          echo "========================================================"

          bash ./build/build.sh \
            LLVM_IAS=1 \
            DTC=./scripts/dtc/dtc \
            -j"$(($(nproc)-1))"

      # ============================================================
      # 8. INSPECT OUTPUT
      #    Tidak menganggap HDRINST sebagai bukti sukses.
      # ============================================================
      - name: Inspect Final Output
        if: always()
        run: |
          set +e

          cd gta9

          echo "========================================================"
          echo " FINAL OUTPUT"
          echo "========================================================"

          echo
          echo "--- Image / DTB / DTBO ---"
          find out \
            -type f \
            \( \
              -name "Image" \
              -o -name "Image.gz" \
              -o -name "vmlinux" \
              -o -name "*.dtb" \
              -o -name "*.dtbo" \
            \) \
            -print

          echo
          echo "--- DTC binary ---"
          if [ -x out/kernel-5.10/scripts/dtc/dtc ]; then
            ls -lh out/kernel-5.10/scripts/dtc/dtc
            file out/kernel-5.10/scripts/dtc/dtc
          else
            echo "DTC binary not found"
          fi

          echo
          echo "--- kernel release ---"
          cat out/kernel-5.10/include/config/kernel.release 2>/dev/null || true

      # ============================================================
      # 9. PACKAGE ONLY WHAT ACTUALLY EXISTS
      # ============================================================
      - name: Package Results
        if: always()
        run: |
          set -eux

          cd gta9

          rm -rf package
          mkdir -p package

          find out -type f -name 'Image.gz' \
            -exec cp {} package/ \; 2>/dev/null || true

          find out -type f -name '*.dtb' \
            -exec cp {} package/ \; 2>/dev/null || true

          find out -type f -name '*.dtbo' \
            -exec cp {} package/ \; 2>/dev/null || true

          cp out/build.config package/ 2>/dev/null || true
          cp out/kernel-5.10/.config package/config 2>/dev/null || true

          cd package

          zip -r ../kernel-gta9-x110.zip .

      # ============================================================
      # 10. UPLOAD
      # ============================================================
      - name: Upload Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-gta9-x110-dtc-lock
          path: |
            gta9/kernel-gta9-x110.zip
          retention-days: 7
          if-no-files-found: warn
